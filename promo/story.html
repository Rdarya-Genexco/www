<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(../assets/fonts/big-shoulders-display.woff2);font-weight:100 900}
html,body{margin:0}body{width:1080px;height:1920px;overflow:hidden;font-family:B,Impact,sans-serif;color:#fff4e0;background:radial-gradient(ellipse at 50% 30%,#3a2470,#13113a 70%)}
.logo{position:absolute;top:120px;left:0;right:0;text-align:center}
.logo img{width:170px;filter:drop-shadow(0 8px 30px rgba(255,122,61,.7))}

.feat span{background:rgba(27,26,58,.9);border:2px solid rgba(111,240,228,.7);border-radius:999px;padding:8px 22px 6px;font-size:36px;font-weight:800}
.cta{position:absolute;left:0;right:0;bottom:70px;text-align:center}
.btn{display:inline-block;background:linear-gradient(180deg,#ff9a5c,#ff7a3d);color:#13113a;border-radius:22px;padding:22px 60px 16px;font-size:72px;font-weight:900;box-shadow:0 10px 40px rgba(255,122,61,.6)}
