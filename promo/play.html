<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Worldwide Wheels</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      @font-face {
        font-family: B;
        src: url(../assets/fonts/big-shoulders-display.woff2);
        font-weight: 100 900;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(ellipse at 50% 30%, #3a2470, #13113a 70%);
        color: #fff4e0;
        font-family: B, Impact, sans-serif;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 20px 16px 32px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }
      .vid {
        position: relative;
        width: 100%;
        cursor: pointer;
      }
      video {
        width: 100%;
        border-radius: 18px;
        display: block;
        box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6);
      }
      a.play {
        display: inline-block;
        background: linear-gradient(180deg, #ff9a5c, #ff7a3d);
        color: #13113a;
        text-decoration: none;
        border-radius: 18px;
        padding: 16px 48px 12px;
        font-size: 44px;
        font-weight: 900;
        box-shadow: 0 10px 36px rgba(255, 122, 61, 0.6);
      }
      a.play:hover {
        transform: translateY(-2px);
      }
      p {
        margin: 0;
        font-size: 22px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <!-- tapping the video or the button opens the game -->
      <a class="vid" href="https://ww-ws.netlify.app/" aria-label="Play Worldwide Wheels"
        ><video src="worldwide-wheels-best-ad.mp4" autoplay muted loop playsinline></video
      ></a>
      <a class="play" href="https://ww-ws.netlify.app/">PLAY FREE ▶</a>
      <p>Free in your browser · phone, PC &amp; Windows</p>
    </main>
  </body>
</html>
