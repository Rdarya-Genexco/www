<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:B;src:url(../assets/fonts/big-shoulders-display.woff2);font-weight:100 900}
html,body{margin:0}body{width:1080px;height:1080px;overflow:hidden;font-family:B,Impact,sans-serif;color:#fff4e0;background:#13113a}
.bg{position:absolute;inset:0;background:url(shot.png) center/cover;filter:saturate(1.15)}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,17,58,.92) 0%,rgba(19,17,58,.35) 38%,rgba(19,17,58,.2) 55%,rgba(19,17,58,.95) 82%)}
.top{position:absolute;left:64px;right:64px;top:56px;display:flex;align-items:center;gap:26px}
.top img{width:120px;height:120px;filter:drop-shadow(0 6px 20px rgba(255,122,61,.6))}
h1{margin:0;font-size:128px;line-height:.82;font-weight:900;text-shadow:0 0 40px rgba(255,122,61,.6)}
.tag{position:absolute;left:64px;top:300px;font-size:44px;font-weight:800;color:#ffc15e;text-shadow:0 3px 14px #000}
.feat{position:absolute;left:64px;right:64px;bottom:150px;display:flex;flex-wrap:wrap;gap:14px}
.feat span{background:rgba(27,26,58,.85);border:2px solid rgba(255,154,92,.8);border-radius:999px;padding:10px 22px 7px;font-size:34px;font-weight:800}
.cta{position:absolute;left:64px;right:64px;bottom:52px;display:flex;justify-content:space-between;align-items:center}
.btn{background:linear-gradient(180deg,#ff9a5c,#ff7a3d);color:#13113a;border-radius:16px;padding:16px 34px 12px;font-size:48px;font-weight:900;box-shadow:0 8px 30px rgba(255,122,61,.55)}
.url{font-size:34px;font-weight:700;opacity:.9}
</style></head><body>
<div class="bg"></div><div class="sh"></div>
<div class="top"><img src="favicon.svg"><h1>Worldwide<br>Wheels</h1></div>
<div class="tag">Race the world · free in your browser</div>
<div class="feat"><span>🌍 4 countries</span><span>🏎️ Supercars</span><span>✈️ Fly · ⚡ Zap · ❄️ Freeze</span><span>👥 Online multiplayer</span><span>🔧 Repair mid-race</span><span>📱 Phone, PC &amp; Windows</span></div>
<div class="cta"><div class="btn">PLAY FREE ▶</div><div class="url">ww-ws.netlify.app</div></div>
</body></html>
