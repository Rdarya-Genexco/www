<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Worldwide Wheels</title>
    <meta
      name="description"
      content="Worldwide Wheels: an arcade street racer across India, Brazil, Mexico and Japan."
    />
    <meta name="theme-color" content="#1b1a3a" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- installable app (PWA): manifest + service worker (sw.js, registered in game.js) -->
    <link rel="manifest" href="manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="W. Wheels" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <!-- game.js first: it listens for the sign-in events that cloud.js sends -->
    <!-- every car (names, prices, stats, looks): edit js/cars.js -->
    <script src="js/cars.js" defer></script>
    <script src="js/game.js" defer></script>
    <!-- 3D view: Three.js is bundled in js/vendor so the game doesn't depend on a CDN -->
    <script type="importmap">
      {
        "imports": {
          "three": "./js/vendor/three/three.module.min.js",
          "three/addons/": "./js/vendor/three/addons/"
        }
      }
    </script>
    <script type="module" src="js/view3d.js"></script>
    <script type="module" src="js/cloud.js"></script>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="hud">
      <div id="tl">
        <b id="lap">Lap 1 of 3</b><span id="tm">0:00.00</span>
        <div class="vs"><b id="pos">1st</b><span id="gap"></span></div>
        <canvas id="mm" width="190" height="124"></canvas>
      </div>
      <div id="tr">
        <span>Best lap</span><b id="bst">–</b><span id="pts"></span>
        <div id="st" class="vs"></div>
      </div>
      <div id="spd">
        <!-- vector speedometer: 270 degree dial, arc fills toward 300 km/h, ticks added by game.js -->
        <svg class="dial" viewBox="0 0 200 200" aria-hidden="true">
          <defs>
            <linearGradient id="dialGrad" x1="0" y1="1" x2="1" y2="0">
              <stop offset="0" stop-color="#6ff0e4" />
              <stop offset="0.55" stop-color="#ffc15e" />
              <stop offset="1" stop-color="#ff4d3d" />
            </linearGradient>
          </defs>
          <circle class="face" cx="100" cy="100" r="96" />
          <circle class="track" cx="100" cy="100" r="80" />
          <circle id="spdArc" class="arc" cx="100" cy="100" r="80" />
          <g id="ticks"></g>
          <g id="needle">
            <line x1="100" y1="100" x2="100" y2="34" />
            <circle cx="100" cy="100" r="7" />
          </g>
        </svg>
        <b id="kmh">0</b><span>km/h</span>
      </div>
      <div id="nit">
        <span>Nitro <span id="nl">READY</span></span
        ><i><u id="nf"></u></i><span class="dmt">Car <span id="dl">100%</span></span
        ><i><u id="df"></u></i>
      </div>
      <div id="toast"></div>
    </div>
    <button id="mu" aria-label="Toggle music" title="Music (M mutes everything)">♪ Music On</button>
    <div id="tc">
      <div class="lr">
        <button data-k="L" aria-label="Steer left">◀</button
        ><button data-k="R" aria-label="Steer right">▶</button>
      </div>
      <div id="joy" role="slider" aria-label="Steering joystick"><i></i></div>
      <div class="rb">
        <button data-k="B" class="dr br" aria-label="Brake">Brake</button
        ><button data-k="D" class="dr" aria-label="Drift">Drift</button
        ><button data-k="N" aria-label="Nitro">Nitro</button>
      </div>
    </div>
    <div id="ov"></div>
  </body>
</html>
