# Starts a race in a real browser on every push and fails if the game throws an error
name: Smoke test
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 >/dev/null 2>&1 &
      - run: node tools/smoke.mjs
