# Builds the Windows desktop app (installer .exe) on a Windows machine when you push a
# version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
# and publishes both files to a release named after the tag. It can also be run by hand from the
# Actions tab: give a version (e.g. v1.0.1) and it creates that tag and release; leave it empty to just
# get the files as a downloadable artifact.
name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to create and release, e.g. v1.0.1 (empty = build only)'
        required: false
        default: ''

env:
  VERSION: ${{ github.event.inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy the game into the app
        shell: bash
        run: |
          mkdir -p desktop/app
          cp -r index.html favicon.svg css js assets desktop/app/
          cp desktop/build/icon.png desktop/app/icon.png
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          # app version from the tag (v1.2.3 -> 1.2.3)
          if [[ -n "$VERSION" ]]; then npm version "${VERSION#v}" --no-git-tag-version --allow-same-version; fi
          # Electron's download server sometimes times out: retry the install a few times
          for i in 1 2 3 4; do npm install --no-audit --no-fund && break; echo "install failed, retry $i"; sleep $((i * 20)); done
          test -d node_modules/electron/dist
          # its tool downloads can time out too: retry
          for i in 1 2 3 4; do npx electron-builder --win --publish never && break; [ $i = 4 ] && exit 1; echo "build failed, retry $i"; sleep $((i * 20)); done
      - uses: actions/upload-artifact@v4
        with:
          name: WorldwideWheels-windows
          path: desktop/dist/*.exe
      - name: Publish the release for this version
        if: env.VERSION != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Worldwide Wheels ${{ env.VERSION }}
          body: |
            Windows build of Worldwide Wheels ${{ env.VERSION }}.

            **WorldwideWheels-Setup.exe** installs the game with Start menu and desktop shortcuts.

            Windows may show a SmartScreen warning because the app isn't code-signed: click "More info", then "Run anyway".
          files: desktop/dist/*.exe
