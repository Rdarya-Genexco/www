# Builds the Windows desktop app (portable .exe and installer) on a Windows machine when you push a
# version tag, e.g.  git tag v1.0.0 && git push origin v1.0.0
# and publishes both files to a release named after the tag. It can also be run by hand from the
# Actions tab (that run only uploads the files as a downloadable artifact, no release).
name: Build Windows app

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy the game into the app
        shell: bash
        run: |
          mkdir -p desktop/app
          cp -r index.html favicon.svg css js assets desktop/app/
          cp desktop/build/icon.png desktop/app/icon.png
      - name: Build
        working-directory: desktop
        shell: bash
        run: |
          # app version from the tag (v1.2.3 -> 1.2.3)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version; fi
          npm install --no-audit --no-fund
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: WorldwideWheels-windows
          path: desktop/dist/*.exe
      - name: Publish the release for this tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Worldwide Wheels ${{ github.ref_name }}
          body: |
            Windows build of Worldwide Wheels ${{ github.ref_name }}.

            - **WorldwideWheels-portable.exe**: no install, just double-click to play.
            - **WorldwideWheels-Setup.exe**: installs the game with Start menu and desktop shortcuts.

            Windows may show a SmartScreen warning because the app isn't code-signed: click "More info", then "Run anyway".
          files: desktop/dist/*.exe
